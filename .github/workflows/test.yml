---
name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - src/**
              - tests/**
              - mise.toml
              - pyproject.toml
              - .github/workflows/test.yml

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: mise run install

      - name: Run linter
        run: mise run lint

      - name: Run tests
        run: mise run test

  # All runs share one live Nintendo account. Many parallel runs, for
  # example of several Renovate PRs, would send bursts of requests that look
  # suspicious, so only one run at a time may run the integration tests.
  wait-for-turn:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write # lock refs under refs/wait-for-turn/
      pull-requests: read # labels for label-weights
    # A new commit on the branch cancels the waiting of the outdated run, so the
    # new run doesn't queue behind it. Once a run has the turn, this job is
    # done: test jobs that already run are never cancelled.
    concurrency:
      group: test-wait-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      # Queue order: manual PRs first, then Renovate updates, then the
      # release-please PR, which is updated after every merge to main anyway.
      # Fails right away if the branch is behind main. Branch protection
      # requires PRs to be up to date, so testing an outdated branch is wasted
      # time: it has to be updated and tested again.
      - name: Wait for turn
        uses: udondan/wait-for-turn@4a9f5171a1dbc3eb182410c772dae951e8ac26e3 # v1.3.0
        with:
          require-up-to-date: true
          label-weights: |
            autorelease: pending=-10
            renovate=-5

  integration-test:
    name: Run Integration Tests (read-only)
    runs-on: ubuntu-latest
    needs: [changes, wait-for-turn]
    # Run even if wait-for-turn failed and fail in the first step, as a skipped
    # job counts as passed.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true')) }}
    steps:
      - name: Check turn
        if: needs.wait-for-turn.result != 'success'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: mise run install

      - name: Run integration tests (read-only)
        run: mise run test-integration
        env:
          SWITCH_PARENTAL_CONTROLS_SESSION_TOKEN: ${{ secrets.SWITCH_PARENTAL_CONTROLS_SESSION_TOKEN }}
          SWITCH_PARENTAL_CONTROLS_TIMEZONE: ${{ secrets.SWITCH_PARENTAL_CONTROLS_TIMEZONE }}
          SWITCH_PARENTAL_CONTROLS_LANG: ${{ secrets.SWITCH_PARENTAL_CONTROLS_LANG }}

  required:
    runs-on: ubuntu-latest
    needs: [changes, test, integration-test]
    if: always()
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.result }}" == "failure" || \
                "${{ needs.changes.result }}" == "cancelled" || \
                "${{ needs.test.result }}" == "failure" || \
                "${{ needs.test.result }}" == "cancelled" || \
                "${{ needs.integration-test.result }}" == "failure" || \
                "${{ needs.integration-test.result }}" == "cancelled" ]]; then
            exit 1
          fi