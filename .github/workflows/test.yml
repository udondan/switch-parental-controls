---
name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read # changed files for paths-filter
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - src/**
              - tests/**
              - mise.toml
              - pyproject.toml
              - .github/workflows/test.yml

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [changes, wait-for-turn]
    # Waits for the turn as well, so the waiting runs of all open pull requests
    # don't take the runners at once. Pull requests from forks don't wait.
    if: always() && (needs.wait-for-turn.result == 'success' || needs.wait-for-turn.result == 'skipped') && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true'))
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install dependencies
        run: mise run install

      - name: Run linter
        run: mise run lint

      - name: Run tests
        run: mise run test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage.xml

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It is skipped along with the tests, e.g. when only the README
  # changes, and passes with a warning if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request' && needs.test.result == 'success'
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  # All runs share one live Nintendo account. Many parallel runs, for
  # example of several Renovate PRs, would send bursts of requests that look
  # suspicious, so only one run at a time may run the integration tests.
  wait-for-turn:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write # lock refs under refs/wait-for-turn/
      pull-requests: read # labels for label-weights
    # A new commit on the branch cancels the waiting of the outdated run, so the
    # new run doesn't queue behind it. Once a run has the turn, this job is
    # done: test jobs that already run are never cancelled.
    concurrency:
      group: test-wait-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      # Queue order: manual PRs first, then Renovate updates, then the
      # release-please PR, which is updated after every merge to main anyway.
      # Fails right away if the branch is behind main. Branch protection
      # requires PRs to be up to date, so testing an outdated branch is wasted
      # time: it has to be updated and tested again.
      - name: Wait for turn
        uses: udondan/wait-for-turn@bf890d60b9e238c05c224dbfb03442bdc09bde72 # v1.4.0
        with:
          require-up-to-date: true
          label-weights: |
            autorelease: pending=-10
            renovate=-5

  integration-test:
    name: Run Integration Tests (read-only)
    runs-on: ubuntu-latest
    needs: [changes, wait-for-turn]
    # Run even if wait-for-turn failed and fail in the first step, as a skipped
    # job counts as passed.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true')) }}
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.wait-for-turn.result != 'success'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install dependencies
        run: mise run install

      - name: Run integration tests (read-only)
        run: mise run test-integration
        env:
          SWITCH_PARENTAL_CONTROLS_SESSION_TOKEN: ${{ secrets.SWITCH_PARENTAL_CONTROLS_SESSION_TOKEN }}
          SWITCH_PARENTAL_CONTROLS_TIMEZONE: ${{ secrets.SWITCH_PARENTAL_CONTROLS_TIMEZONE }}
          SWITCH_PARENTAL_CONTROLS_LANG: ${{ secrets.SWITCH_PARENTAL_CONTROLS_LANG }}

  actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  required:
    runs-on: ubuntu-latest
    needs: [changes, test, coverage, integration-test, actions]
    if: always()
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.result }}" == "failure" || \
                "${{ needs.changes.result }}" == "cancelled" || \
                "${{ needs.test.result }}" == "failure" || \
                "${{ needs.test.result }}" == "cancelled" || \
                "${{ needs.coverage.result }}" == "failure" || \
                "${{ needs.coverage.result }}" == "cancelled" || \
                "${{ needs.integration-test.result }}" == "failure" || \
                "${{ needs.integration-test.result }}" == "cancelled" || \
                "${{ needs.actions.result }}" == "failure" || \
                "${{ needs.actions.result }}" == "cancelled" ]]; then
            exit 1
          fi