---
name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  # All runs share one live Nintendo account. Many parallel runs, for
  # example of several Renovate PRs, would send bursts of requests that look
  # suspicious, so only one run at a time may run the integration tests. All
  # other jobs wait for it too: while another run holds the turn, this one
  # likely needs a rebase anyway. Pull requests from forks don't get the
  # secrets and skip the wait.
  boarding-gate:
    name: Queue
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
    permissions:
      actions: read
      contents: write # lock refs under refs/boarding-gate/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    # Queue order, the concurrency group that cancels outdated waiting runs and
    # the rebase of branches that are behind main: see
    # https://github.com/udondan/boarding-gate#reusable-workflow
    # The rebase needs OVERRIDE_TOKEN: pushes with github.token don't start new runs.
    uses: udondan/boarding-gate/.github/workflows/boarding-gate.yml@v1
    secrets:
      update-token: ${{ secrets.OVERRIDE_TOKEN }}

  # The tests and the Docker job only run if code or build config changed.
  # Skipped outside of pull requests, so pushes to main always run the tests.
  changes:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the integration tests.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # changed files for paths-filter
    outputs:
      src: ${{ steps.filter.outputs.src }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - src/**
              - tests/**
              - mise.toml
              - pyproject.toml
              - uv.lock
              - .python-version
              - .github/workflows/test.yml
            docker:
              - Dockerfile
              - .dockerignore
              - docker-mcp.yml
              - src/**
              - mise.toml
              - pyproject.toml
              - uv.lock
              - .python-version
              - .github/workflows/test.yml

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [boarding-gate, changes]
    # Fail instead of skip if boarding-gate failed, see the integration tests.
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true')) }}
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      # --locked fails if uv.lock doesn't match pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run linter
        run: mise run lint

      - name: Run tests
        run: mise run test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage.xml

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It is skipped along with the tests, e.g. when only the README
  # changes, and passes with a warning if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test.result == 'success' }}
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  integration-test:
    name: Run Integration Tests (read-only)
    runs-on: ubuntu-latest
    needs: [boarding-gate, test]
    # Run even if boarding-gate failed and fail in the first step, as a skipped
    # job counts as passed. Only runs if the unit tests passed: they are
    # skipped if no code changed, and if they failed, the live account isn't
    # needed. Forks don't get the secrets.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) && needs.test.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      # --locked fails if uv.lock doesn't match pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run integration tests (read-only)
        run: mise run test-integration
        env:
          SWITCH_PARENTAL_CONTROLS_SESSION_TOKEN: ${{ secrets.SWITCH_PARENTAL_CONTROLS_SESSION_TOKEN }}
          SWITCH_PARENTAL_CONTROLS_TIMEZONE: ${{ secrets.SWITCH_PARENTAL_CONTROLS_TIMEZONE }}
          SWITCH_PARENTAL_CONTROLS_LANG: ${{ secrets.SWITCH_PARENTAL_CONTROLS_LANG }}

  actions:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the integration tests.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # Code smells (complexity, duplication, nesting) via Qlty. Git-aware: only
  # smells introduced by the PR compared to main fail the job.
  qlty:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the integration tests.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@0ff2178667bf8eb28ed0013a7ef54857a24d4056 # v2.7.0

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi

  # Builds the image and runs it the way the Docker MCP Toolkit does, through
  # a profile and the gateway. Needs no Nintendo credentials: the server starts
  # without a token and listing the tools doesn't call the API. Only runs if
  # the unit tests passed or were skipped because only Docker files changed.
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [boarding-gate, changes, test]
    if: ${{ !cancelled() && needs.changes.outputs.docker == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: uv github:docker/mcp-gateway

      - name: Install docker mcp plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          ln -s "$(mise which docker-mcp)" ~/.docker/cli-plugins/docker-mcp
          docker mcp version

      - run: mise run docker-build

      - name: Run the CLI in the image
        run: |
          docker run --rm udondan/switch-parental-controls --version
          docker run --rm udondan/switch-parental-controls --help

      - run: mise run docker-register ci

      # The gateway only verifies signatures of images under mcp/, and finds
      # the locally built image without pulling it.
      - name: List tools through the gateway
        run: |
          docker mcp gateway run --profile ci --dry-run --verbose 2>&1 | tee gateway.log
          grep -E "switch-parental-controls: \([1-9][0-9]* tools\)" gateway.log

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    runs-on: ubuntu-latest
    needs: [boarding-gate, changes, test, coverage, integration-test, actions, qlty, docker]
    if: always()
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
