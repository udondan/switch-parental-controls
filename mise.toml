[settings]
jobs = 1

[tools]
python = "3.15.2"
# Workflow linters for the actions job of the Test workflow, which installs only these three.
actionlint = "1.7.12"
# The runner's own shellcheck is older and reports differently. actionlint runs it over every `run:` block.
shellcheck = "0.11.0"
zizmor = "1.32.0"
# The `docker mcp` plugin for the docker job of the Test workflow. Docker Desktop ships its own.
"github:docker/mcp-gateway" = "0.44.1"

[tasks.install]
description = "Install dependencies (requires Python >=3.12 on PATH)"
run = "python -m venv .venv && .venv/bin/pip install -e '.[dev]'"

[tasks.test]
description = "Run tests"
run = ".venv/bin/pytest tests/ -v -m 'not integration'"

[tasks.test-coverage]
description = "Run tests and write the coverage report to coverage.xml"
run = ".venv/bin/pytest tests/ -v -m 'not integration' --cov=switch_parental_controls --cov-report=xml --cov-report=term"

[tasks.test-integration]
description = "Run integration tests against the real Nintendo API (requires .env with SWITCH_PARENTAL_CONTROLS_SESSION_TOKEN)"
run = ".venv/bin/pytest tests/test_integration.py -v -m integration"

[tasks.run]
description = "Run the MCP server"
run = ".venv/bin/python -m switch_parental_controls mcp"

[tasks.lint]
description = "Run linter and check formatting"
run = [
  ".venv/bin/ruff check src/ tests/",
  ".venv/bin/ruff format --check src/ tests/",
]

[tasks.format]
description = "Format code"
run = ".venv/bin/ruff format src/ tests/"

[tasks.lint-fix]
description = "Run linter and fix issues"
run = ".venv/bin/ruff check --fix src/ tests/"

[tasks.inspect]
description = "Open MCP Inspector connected to the switch_parental_controls server (requires Node.js / npx on PATH)"
run = "npx @modelcontextprotocol/inspector .venv/bin/python -m switch_parental_controls mcp"

[tasks.docker-build]
description = "Build the Docker image"
run = "docker build -t udondan/switch-parental-controls ."

[tasks.docker-register]
description = "Add the server to a Docker MCP Toolkit profile (created if missing)"
usage = 'arg "[profile]" default="switch-parental-controls" help="Profile ID"'
# docker mcp only reads server files from its catalogs directory.
run = """
catalogs="$HOME/.docker/mcp/catalogs"
mkdir -p "$catalogs"
cp docker-mcp.yml "$catalogs/switch-parental-controls.yml"
server="file://$catalogs/switch-parental-controls.yml"
if docker mcp profile show "$usage_profile" >/dev/null 2>&1; then
  docker mcp profile server add "$usage_profile" --server "$server"
else
  docker mcp profile create --name "$usage_profile" --id "$usage_profile" --server "$server"
fi
"""

[tasks.docker]
description = "Build the image and add it to a Docker MCP Toolkit profile"
depends = ["docker-build", "docker-register"]
